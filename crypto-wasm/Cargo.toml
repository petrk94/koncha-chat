[package]
name = "koncha-olm-wasm"
version = "0.1.0"
edition = "2021"
publish = false
license = "LicenseRef-Kirpeit-Solutions-Proprietary"
description = "Thin wasm-bindgen boundary around audited vodozemac Olm sessions"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vodozemac = "=0.11.1"
wasm-bindgen = "=0.2.105"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
