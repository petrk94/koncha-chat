name: Koncha tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify PHP and JavaScript
        run: |
          php -v
          php -l public/api.php
          php -l public/push-service.php
          node --check public/app.js
          node --check public/sw.js
          node --check public/push-client.js
      - name: Run automated tests
        run: npm test
