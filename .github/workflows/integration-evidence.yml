name: Koncha integration evidence (issues 7–9)
on:
  pull_request:
    paths:
      - 'scripts/olm-wasm-probe.mjs'
      - 'tests/rust-e2ee-smoke/**'
      - 'scripts/real-model-inference.mjs'
      - 'tests/browser-smoke.py'
      - 'tests/browser-engine-probe.py'
      - 'tests/browser-local-ai.py'
      - 'public/app.js'
      - 'public/translation-selftest.js'
      - 'tests/translation-selftest.test.js'
      - '.github/workflows/integration-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  # This is a crypto library BOOTSTRAP proof, not a forward-secret message test.
  audited-rust-crypto-bootstrap:
    name: Rust crypto WASM device key bootstrap (not integrated E2EE)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock @matrix-org/matrix-sdk-crypto-wasm@19.0.0
      - run: node scripts/olm-wasm-probe.mjs

  upstream-olm-ratchet-proof:
    name: Audited Rust Olm handshake + ratcheted messages (not Koncha transport)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Run pinned vodozemac Double Ratchet proof
        run: cargo run --manifest-path tests/rust-e2ee-smoke/Cargo.toml --release

  local-ai-real-inference:
    name: Real ONNX inference in CI (${{ matrix.pair }}; NOT a mobile test)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pair: [de-en, en-de, ja-en, en-ja]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-package-lock
      - run: python -m pip install 'huggingface_hub>=0.27,<2'
      - run: npm run ai:build
      - run: python scripts/prepare-models.py ${{ matrix.pair }}
      - run: npm run ai:verify
      - run: node scripts/real-model-inference.mjs ${{ matrix.pair }}
      - name: In-browser WASM translation (de-en only)
        if: matrix.pair == 'de-en'
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
          python tests/browser-local-ai.py
      # No chat data or proprietary content is involved.

  cross-engine-pwa:
    name: Desktop browser engines + local app shell (NOT physical phones)
    # Playwright 1.56 officially supports Ubuntu 24.04; ubuntu-latest now uses 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium firefox webkit
      # Koncha's fresh-chat UI intentionally FAILS CLOSED if Olm WASM is missing.
      - run: rustup target add wasm32-unknown-unknown
      - run: npm install --no-save --no-package-lock wasm-pack@0.15.1
      - run: npm run crypto:build
      - run: python tests/browser-engine-probe.py
      - run: python tests/browser-smoke.py
