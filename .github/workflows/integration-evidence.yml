name: Koncha integration evidence (issues 7–9)
on:
  pull_request:
    paths:
      - 'scripts/olm-wasm-probe.mjs'
      - 'scripts/real-model-inference.mjs'
      - 'tests/browser-smoke.py'
      - 'tests/browser-engine-probe.py'
      - 'public/app.js'
      - 'public/translation-selftest.js'
      - 'tests/translation-selftest.test.js'
      - '.github/workflows/integration-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  # This is a crypto library BOOTSTRAP proof, not a forward-secret message test.
  audited-rust-crypto-bootstrap:
    name: Rust crypto WASM device key bootstrap (not integrated E2EE)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock @matrix-org/matrix-sdk-crypto-wasm@19.0.0
      - run: node scripts/olm-wasm-probe.mjs

  local-ai-real-inference:
    name: Real ONNX inference on CI (DE → EN; NOT a mobile test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-package-lock
      - run: python -m pip install 'huggingface_hub>=0.27,<2'
      - run: npm run ai:build
      - run: python scripts/prepare-models.py de-en
      - run: npm run ai:verify
      - run: node scripts/real-model-inference.mjs de-en
      # No chat data or proprietary content is involved.

  cross-engine-pwa:
    name: Desktop browser engines + local app shell (NOT physical phones)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium firefox webkit
      - run: python tests/browser-engine-probe.py
      - run: python tests/browser-smoke.py
